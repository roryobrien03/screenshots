<html>
    <title>screenshots</title>
    <p style="color: blue; font-size: 1.4em;">randomised collection of quotes, lyrics, memes, and other bits.<br>zoom and hold to see images more clearly.<br>refresh and keep scrolling for more.<br>better on desktop.<br>continuous work in progress.<br>ig: <a href="https://instagram.com/roryobrien03" target="_blank">@roryobrien03</a></p>
    <div id="container" style="position: relative;">
    </div>
    <script>

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

fetch("image_widths_heights.json").then(f => {
    if (f.status == 404) {
        alert("unable to find image_widths_heights.json -- you should run lister.py to create it.");
    }
    return f.json()
}).then(data => {
    let key_values = shuffleArray(data);

    const rect = container.getBoundingClientRect();
    let screen_width = rect.width;
    // Container's own offset from the page origin, so text-node positions (measured in page
    // coordinates below) can be converted into coordinates relative to the container -- which
    // is what image positions are placed in now that #container is position:relative.
    const container_page_top = rect.top + window.pageYOffset;
    const container_page_left = rect.left + window.pageXOffset;

    // By default I will have a lot of images that are just enormous and take up most of the screen. Here I attempt
    // to resize the images to be approximately a similar size.
    // To adjust image size, change goal_pixels here.
    const pairs = key_values.map(([key, [w, h]]) => {
        let goal_pixels = 500*300;
        let actual_pixels = w*h;
        if (actual_pixels/goal_pixels > 16) {
            return [parseInt(w/8), parseInt(h/8)];
        }
        if (actual_pixels/goal_pixels > 4) {
            return [parseInt(w/4), parseInt(h/4)];
        }
        return [parseInt(w/2), parseInt(h/2)];
    }).map(([w, h]) => [(w+10) > screen_width ? screen_width-10 : w, h]);

    // gather all the text nodes so the images don't intersect them
    const textNodes = [];
    const treeWalker = document.createTreeWalker(
        document.body,
        NodeFilter.SHOW_TEXT,
        { acceptNode: (node) => node.textContent.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT }
    );
    while(treeWalker.nextNode()) textNodes.push(treeWalker.currentNode);

    // Find the gap beside the caption with the most usable area, in container-relative
    // coordinates -- used below to deliberately place an early image there. The caption wraps
    // over several lines (each <br>-separated piece is its own text node). On a narrow mobile
    // screen a short line (e.g. "better on desktop.") can have lots of width beside it despite
    // a longer line above/below it; on a wide desktop screen every line has lots of width beside
    // it, so the limiting factor there is height instead. Trying every line as a starting point
    // and extending down through any following lines that are equally short, then picking
    // whichever start gives the largest width*height gap, works for both shapes of screen.
    const lineRects = textNodes.map(node => {
        const range = document.createRange();
        range.selectNodeContents(node);
        const r = range.getBoundingClientRect();
        return {
            right: r.right + window.pageXOffset - container_page_left,
            top: r.top + window.pageYOffset - container_page_top,
            bottom: r.bottom + window.pageYOffset - container_page_top,
        };
    }).sort((a, b) => a.top - b.top);

    let caption_right = 0, caption_top = 0, caption_bottom = 0, best_area = -Infinity;
    lineRects.forEach((start, i) => {
        const right = start.right;
        let bottom = start.bottom;
        for (let idx = i + 1; idx < lineRects.length; idx++) {
            if (lineRects[idx].right > right) break;
            bottom = lineRects[idx].bottom;
        }
        const area = (screen_width - right) * (bottom - start.top);
        if (area > best_area) {
            best_area = area;
            caption_right = right;
            caption_top = start.top;
            caption_bottom = bottom;
        }
    });

    // Now we attempt to place images. I looked at some actually good algorithms but decided to instead use a stupid
    // algorithm: for each image, attempt to place it in a random location up to height 600. if it intersects with
    // any other images, try again. If after 50 attempts at random placing we don't manage to place it, increase the
    // height by 50.
    let positions = [];
    let i = 0;
    let max_bottom = 0;

    // Deterministically claim the gap beside the caption with the first image (in shuffle
    // order) that's small enough to fit there, instead of leaving it to a random search that
    // can come up empty. room_beside_caption/caption row height give that image's max size. The
    // caption's gap is often only as tall as one line of text (~30px), which very few images are
    // short enough to fit -- so this scans the whole list rather than just the first few shuffled,
    // to reliably find one of the handful that qualify instead of frequently finding none.
    const room_beside_caption = screen_width - caption_right;
    const caption_row_height = caption_bottom - caption_top;
    let top_right_index = -1;
    for (let k = 0; k < pairs.length; k++) {
        const [pw, ph] = pairs[k];
        if (pw < room_beside_caption && ph < caption_row_height) {
            top_right_index = k;
            break;
        }
    }
    if (top_right_index !== -1) {
        const [pw, ph] = pairs[top_right_index];
        positions[top_right_index] = [parseInt(caption_right + 10), parseInt(caption_top)];
    }

    // this could be a for loop, but i thought it would be fun to have them appear gradually.
    let interval = setInterval(() => {
        if (i === top_right_index) {
            // Already placed above -- just create the element below and move on.
        } else {
        // Start each image's search window with a randomised amount of room, instead of a fixed
        // small band (e.g. 600). A fixed small starting height meant only small/narrow images
        // could find a free spot early on, so they'd disproportionately end up bunched near the
        // top on every load. Randomising this per image (independent of that image's own shape)
        // means big and small images compete for space near the top equally often.
        // The window is also scaled down for wide viewports: a flat pixel height leaves tons of
        // unused horizontal room on a wide desktop screen before it's forced to grow, which on a
        // very wide screen can show up as a big empty gap at the very top before anything has
        // had to spill into it. Narrower windows on wide screens keep the top reliably full.
        const width_factor = Math.min(1, 1400 / screen_width);
        let height = (900 + Math.floor(Math.random() * 1400)) * width_factor;
        let [w, h] = pairs[i];
        while (1) {
            let found_place = false;
            let w_max = screen_width-w;
            let h_max = height-h;
            for (let _ = 0; _ < 50; _++) {
                let a_left = Math.random() * w_max;
                let a_top = Math.random() * h_max;
                let a_right = a_left+w;
                let a_bottom = a_top+h;

                // do intersection checks against images (skip indices not placed yet -- the
                // top-right slot above is pre-filled out of order, so positions can be sparse)
                let intersects = false;
                for (let j = 0; j < positions.length; j++) {
                    if (!positions[j]) continue;
                    let [b_left, b_top] = positions[j];
                    let b_right = b_left + pairs[j][0];
                    let b_bottom = b_top + pairs[j][1];
                    if (a_left < b_right && a_right > b_left && a_bottom > b_top && a_top < b_bottom) {
                        intersects = true;
                        break;
                    }
                }

                // do intersection checks against text. TOCONSIDER: cache bounding rect calculation?
                for (const node of textNodes) {
                    const range = document.createRange();
                    range.selectNodeContents(node);
                    const rect = range.getBoundingClientRect();
                    let node_top = rect.top + window.pageYOffset - container_page_top;
                    let node_left = rect.left + window.pageXOffset - container_page_left;
                    
                    if (a_left < (node_left+rect.width) && a_right > node_left && a_bottom > node_top && a_top < (node_top+rect.height)) {
                        intersects = true;
                        break;
                    }
                }

                if (!intersects) {
                    found_place = true;
                    positions[i] = [parseInt(a_left), parseInt(a_top)];
                    break;
                }
            }
            if (found_place) {
                break;
            } else {
                height += 50;
            }
        }
        }

        // Create the image
        let img = document.createElement("img");
        img.src = key_values[i][0];
        img.width = pairs[i][0];
        img.height = pairs[i][1];
        img.style.width = pairs[i][0];
        img.style.height = pairs[i][1];
        img.style.position = "absolute";
        img.style.top = positions[i][1];
        img.style.left = positions[i][0];
        img.loading = "lazy";
        container.appendChild(img);

        // #container has no content in normal flow (everything inside it is absolutely
        // positioned), so without this its height stays 0 and the page never lays out /
        // loads images below the fold correctly, especially on mobile browsers opened
        // fresh from a link. Keep it grown to fit everything placed so far.
        const bottom = positions[i][1] + pairs[i][1];
        if (bottom > max_bottom) {
            max_bottom = bottom;
            container.style.minHeight = max_bottom + "px";
        }

        i++;
        if (i == key_values.length) {
            clearInterval(interval);
        }
    }, 5);
})
    </script>
</html>
